# Config de análisis enfocada en el objetivo del proyecto:
#   1) código muerto / sin uso   -> reglas Unused* + potential-bugs + UnreachableCode
#   2) estructura y redundancia  -> reglas complexity
# El resto de rulesets/reglas se desactivan para no llenar el informe de
# ruido de estilo que no aporta a esa meta. Basada en la config por defecto
# de detekt 2.0.0-alpha.6 (validada por detektGenerateConfig).
#
# Nota: las reglas Unused* solo funcionan con type resolution -> ejecutar
# la task `detektMain` (no `detekt`).

config:
  validation: true
  warningsAsErrors: false

comments:
  active: false

naming:
  active: false

exceptions:
  active: false

# Estructura / mala estructura: umbrales por defecto de detekt.
complexity:
  active: true

# Bugs reales: UnreachableCode (código muerto), UnsafeCallOnNullableType, etc.
potential-bugs:
  active: true

empty-blocks:
  active: true

performance:
  active: true

coroutines:
  active: true
  # 46 findings de preferencia de diseño (inyectar dispatchers), no aporta
  # al análisis de código muerto/estructura.
  InjectDispatcher:
    active: false

# style en general es ruido (formato, convenciones), pero sus reglas de
# "sin uso" son exactamente lo que buscamos: solo esas quedan activas.
