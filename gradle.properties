org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# :core comparte código entre los targets JVM y Android con un source set
# intermedio propio (jvmSharedMain), que la plantilla por defecto no cubre:
# se declaran las aristas a mano en core/build.gradle.kts.
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9 activa "built-in Kotlin" por defecto. Mientras `:core` siga aplicando
# `org.jetbrains.kotlin.multiplatform` con versión explícita, hay que mantener
# built-in Kotlin desactivado: si se quita esta línea, Gradle falla al configurar
# `:core` con "plugin is already on the classpath with an unknown version".
# `android.newDsl=false` es obligatorio junto a ella porque el plugin
# `kotlin-android` no es compatible con el DSL nuevo.
# Para migrar a built-in Kotlin, hacerlo en una rama aparte y comprobar que
# `./gradlew help` sigue pasando después de quitar ambas líneas.
android.newDsl=false
android.builtInKotlin=false
