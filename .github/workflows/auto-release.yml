name: Auto Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipo de incremento de versión"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Preparar release (versión + borrador)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      next_tag: ${{ steps.version.outputs.next_tag }}
      next_name: ${{ steps.version.outputs.next_name }}
      next_code: ${{ steps.version.outputs.next_code }}
      source_sha: ${{ github.sha }}
      prev_tag: ${{ steps.version.outputs.prev_tag }}
      commit_count: ${{ steps.version.outputs.commit_count }}
      changelog: ${{ steps.version.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version and changelog
        id: version
        run: |
          GRADLE_FILE="app/build.gradle.kts"

          CURRENT_CODE=$(sed -nE 's/.*versionCode *= *([0-9]+).*/\1/p' "$GRADLE_FILE" | head -n1)
          CURRENT_NAME=$(sed -nE 's/.*versionName *= *"([^"]+)".*/\1/p' "$GRADLE_FILE" | head -n1)

          if [ -z "$CURRENT_CODE" ] || [ -z "$CURRENT_NAME" ]; then
            echo "::error::No se pudo leer versionCode/versionName de $GRADLE_FILE"
            exit 1
          fi

          BUMP="${{ github.event.inputs.bump }}"
          BUMP="${BUMP:-patch}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_NAME"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *)     PATCH=$((PATCH + 1)) ;;
          esac

          NEXT_NAME="${MAJOR}.${MINOR}.${PATCH}"
          NEXT_CODE=$((CURRENT_CODE + 1))
          NEXT_TAG="v${NEXT_NAME}"

          if git rev-parse -q --verify "refs/tags/${NEXT_TAG}" >/dev/null || git ls-remote --tags origin "refs/tags/${NEXT_TAG}" | grep -q "${NEXT_TAG}"; then
            echo "::warning::El tag ${NEXT_TAG} ya existe (local o remoto). Intentando limpiar y reutilizar..."
            gh release delete "${NEXT_TAG}" --yes 2>/dev/null || true
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${NEXT_TAG}" 2>/dev/null || true
            git tag -d "${NEXT_TAG}" 2>/dev/null || true
          fi

          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          CHANGELOG=$(git log -n 50 --pretty=format:'- %s (%h)' --no-merges "$RANGE")
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Sin cambios desde ${PREV_TAG:-el inicio}"
          fi
          COMMIT_COUNT=$(printf '%s\n' "$CHANGELOG" | grep -c '^- ' || true)

          echo "Versión actual: ${CURRENT_NAME} (code ${CURRENT_CODE})"
          echo "Nueva versión:  ${NEXT_NAME} (code ${NEXT_CODE}) -> ${NEXT_TAG}"

          {
            echo "next_tag=${NEXT_TAG}"
            echo "next_name=${NEXT_NAME}"
            echo "next_code=${NEXT_CODE}"
            echo "prev_tag=${PREV_TAG}"
            echo "commit_count=${COMMIT_COUNT}"
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bump version in build.gradle.kts
        shell: bash
        run: |
          sed -i -E "s/versionCode *= *[0-9]+/versionCode = ${{ steps.version.outputs.next_code }}/" app/build.gradle.kts
          sed -i -E "s/versionName *= *\"[^\"]+\"/versionName = \"${{ steps.version.outputs.next_name }}\"/" app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts

      - name: Upload bumped sources
        uses: actions/upload-artifact@v4
        with:
          name: bumped-sources
          path: app/build.gradle.kts
          if-no-files-found: error

      - name: Create empty draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next_tag }}
          name: ${{ steps.version.outputs.next_tag }}
          body: |
            ## plyr ${{ steps.version.outputs.next_tag }}

            **Commits:** ${{ steps.version.outputs.commit_count }}

            ### Changelog
            ${{ steps.version.outputs.changelog }}
          draft: true
          prerelease: false

  android:
    name: Android APK (release firmado)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      apk_size: ${{ steps.find_apk.outputs.apk_size }}
      apk_sha256: ${{ steps.find_apk.outputs.apk_sha256 }}
      cert_sha256: ${{ steps.find_apk.outputs.cert_sha256 }}
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Download bumped sources
        uses: actions/download-artifact@v4
        with:
          name: bumped-sources
          path: .

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Check signing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Falta el secreto SIGNING_KEY. Configura los secretos de firma (SIGNING_KEY con el .jks en base64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) antes de publicar."
            exit 1
          fi

      - name: Decode keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > release.keystore
          {
            echo "storeFile=$GITHUB_WORKSPACE/release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Accept licenses and install packages
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" || true

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Extract R8 usage report (código eliminado)
        run: |
          USAGE="app/build/outputs/mapping/release/usage.txt"
          if [ -f "$USAGE" ]; then
            grep '^com\.plyr' "$USAGE" > r8-usage-plyr.txt || true
            APP_CLASSES=$(wc -l < r8-usage-plyr.txt)
            {
              echo "### R8: código no alcanzable eliminado"
              echo ""
              echo "- **$APP_CLASSES clases/miembros de \`com.plyr\`** en el release (candidatos a borrar)"
              echo "- Informe completo: artifact \`r8-usage\` (\`usage.txt\`, $(wc -l < "$USAGE") líneas)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No se encontró usage.txt (¿minify desactivado?)"
          fi

      - name: Upload R8 usage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r8-usage
          path: |
            app/build/outputs/mapping/release/usage.txt
            r8-usage-plyr.txt
          if-no-files-found: warn

      - name: Verify and locate APK
        id: find_apk
        run: |
          APK_PATH="app/build/outputs/apk/release/plyr.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK no encontrado en $APK_PATH"
            exit 1
          fi

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::No se encontró apksigner en $SDK/build-tools"
            exit 1
          fi

          echo "Verificando firma con: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK_PATH" | tee certs.txt

          CERT_SHA256=$(grep -m1 'certificate SHA-256 digest:' certs.txt | awk '{print $NF}')
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::No se pudo extraer la huella SHA-256 del certificado de firma"
            exit 1
          fi
          CERT_COLONS=$(echo "$CERT_SHA256" | sed 's/../&:/g; s/:$//')
          CERT_SHA256_NORM=$(echo "$CERT_SHA256" | tr 'a-f' 'A-F')
          APK_PACKAGE=$(grep -oE 'applicationId *= *"[^"]+"' app/build.gradle.kts | sed -E 's/.*"(.*)"/\1/')

          {
            echo "### Huella SHA-256 del certificado de firma"
            echo
            echo "Pega este valor en **Android Developer Console > Package names > \`$APK_PACKAGE\` > Add key**:"
            echo
            echo '```'
            echo "$CERT_COLONS"
            echo '```'
            echo
            echo "Sin dos puntos: \`$CERT_SHA256\`"
            echo
            echo "Si ya la habías registrado con otro valor, actualízala: debe coincidir exactamente o el APK no se instalará."
          } >> "$GITHUB_STEP_SUMMARY"

          EXPECTED="${{ vars.EXPECTED_CERT_SHA256 }}"
          if [ -n "$EXPECTED" ]; then
            EXPECTED_NORM=$(echo "$EXPECTED" | tr -d '[:space:]:' | tr 'a-f' 'A-F')
            if [ "$EXPECTED_NORM" != "$CERT_SHA256_NORM" ]; then
              echo "::error::La huella firmada ($CERT_SHA256) no coincide con EXPECTED_CERT_SHA256 ($EXPECTED_NORM). El APK se firmaría con una clave distinta a la registrada en Android Developer Console y no se podría instalar."
              exit 1
            fi
            echo "Huella coincide con la registrada en Android Developer Console."
          else
            echo "::warning::EXPECTED_CERT_SHA256 no está definida. Créala en Settings > Secrets and variables > Actions > Variables para validar la firma automáticamente en cada release."
          fi

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_size=$(du -h "$APK_PATH" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload APK to release draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.next_tag }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: true
          prerelease: false

  desktop:
    name: Escritorio (${{ matrix.platform }})
    needs: prepare
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux x64
          - os: windows-latest
            platform: Windows x64
          - os: macos-14
            platform: macOS Apple Silicon
          - os: macos-15-intel
            platform: macOS Intel
    env:
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Download bumped sources
        uses: actions/download-artifact@v4
        with:
          name: bumped-sources
          path: .

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x ./gradlew

      - name: Accept licenses and install packages
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" || true

      - name: Instalar Android SDK 37 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdkman = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkman)) { $sdkman = "sdkmanager" }
          echo "y" | & $sdkman --licenses 2>&1 | Out-Null
          & $sdkman "platforms;android-37" "build-tools;37.0.0"

      - name: Preparar entorno macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install create-dmg 2>&1 | tail -5 || true
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV

      - name: Preparar entorno Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --version 3.14.1 --allow-downgrade --no-progress -y 2>&1 | tail -3
          echo "$env:WIX\bin" >> $env:GITHUB_PATH

      - name: Preparar entorno Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot dpkg-dev rpm 2>&1 | tail -3

      - name: Build desktop installers
        shell: bash
        run: ./gradlew :desktop:packageDistributionForCurrentOS --no-daemon --stacktrace

      - name: Collect and upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.next_tag }}"
          OUTDIR="desktop-out"
          mkdir -p "$OUTDIR"
          
          # Collect installers
          find desktop/build/compose/binaries -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.dmg" -o -name "*.exe" \) -exec cp {} "$OUTDIR"/ \; 2>&1 | tail -10
          find desktop/build/jpackage -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.dmg" \) -exec cp {} "$OUTDIR"/ \; 2>&1 | tail -10
          
          ls -lh "$OUTDIR"
          
          if [ -z "$(ls -A $OUTDIR)" ]; then
            echo "::error::No se encontraron instaladores para este sistema"
            exit 1
          fi
          
          # Generate checksums
          for f in "$OUTDIR"/*; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          
          # Upload to draft release
          gh release upload "$TAG" "$OUTDIR"/* --clobber
          
          ls "$OUTDIR" > desktop-installers.txt
          
          {
            echo "### Desktop (${{ matrix.platform }})"
            echo ""
            echo "Instalables adjuntos a la release (borrador):"
            echo ""
            while IFS= read -r f; do
              [ -n "$f" ] && echo "- \`$f\`"
            done < desktop-installers.txt
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publicar release
    needs: [prepare, android, desktop]
    if: always() && needs.prepare.result == 'success' && needs.android.result == 'success' && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Download bumped sources
        uses: actions/download-artifact@v4
        with:
          name: bumped-sources
          path: .

      - name: Download release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "${{ needs.prepare.outputs.next_tag }}" --dir release-assets
          echo "Descargados $(ls release-assets | wc -l | tr -d ' ') ficheros:"
          ls -lh release-assets

      - name: Commit version bump and create tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "::notice::No hay cambios para commitear (posiblemente ya actualizados)"
          else
            git commit -m "chore(release): ${{ needs.prepare.outputs.next_tag }} [skip ci]" || true
          fi
          git tag -a "${{ needs.prepare.outputs.next_tag }}" -m "Release ${{ needs.prepare.outputs.next_tag }}" 2>/dev/null || git tag -f -a "${{ needs.prepare.outputs.next_tag }}" -m "Release ${{ needs.prepare.outputs.next_tag }}"
          git push -f origin "${{ needs.prepare.outputs.next_tag }}" || true

      - name: Publish versioned release
        run: gh release edit "${{ needs.prepare.outputs.next_tag }}" --draft=false

      - name: Refresh 'latest' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ${{ needs.prepare.outputs.next_tag }}
          body: |
            ## plyr (latest)

            **Current version:** ${{ needs.prepare.outputs.next_tag }}

            Android: `plyr.apk`. Desktop: `.deb`/`.rpm`/`.AppImage`, `.msi` or `.dmg`
            **APK size:** ${{ needs.android.outputs.apk_size }}
            **SHA-256:** `${{ needs.android.outputs.apk_sha256 }}`

            ### Recent changes
            ${{ needs.prepare.outputs.changelog }}
          files: release-assets/*
          draft: false
          prerelease: false

      - name: Prune superseded assets from 'latest'
        run: |
          set -euo pipefail
          gh release view latest --json assets --jq -r '.assets[].name' > old-assets.txt || true
          if [ ! -s old-assets.txt ]; then
            exit 0
          fi
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if [ -f "release-assets/$name" ]; then
              echo "  se queda:  $name"
            else
              echo "  se retira: $name"
              gh release delete-asset latest "$name" --yes || true
            fi
          done < old-assets.txt

      - name: Push version bump to main
        continue-on-error: true
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            echo "::warning::No se pudo hacer push directo a ${GITHUB_REF_NAME} (posible protección de rama). El tag y la release ya se han publicado."
            echo "Si lo necesitas, crea un PR con app/build.gradle.kts actualizado."
            exit 0
          }

  cleanup:
    needs: [prepare, android, desktop, publish]
    if: always() && (needs.publish.result == 'failure' || needs.publish.result == 'cancelled' || ((needs.android.result == 'failure' || needs.desktop.result == 'failure') && needs.publish.result != 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete draft release and tag
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.next_tag }}"
          if [ -z "$TAG" ]; then
            exit 0
          fi
          # Don't delete if the tag was already pushed (release might be published)
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "::notice::Tag ${TAG} ya existe en remoto; no se borra para evitar eliminar una release ya publicada."
            exit 0
          fi
          gh release delete "$TAG" --yes || true
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true
