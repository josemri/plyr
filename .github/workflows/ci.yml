name: CI

# Verificación continua (M34): cada push a `main` y cada pull request pasan el
# mismo análisis y los mismos tests que se exigen antes de una release, de forma
# que una release nunca publique código que no ha pasado por aquí.
# La release en sí la hace `auto-release.yml` (manual, con `workflow_dispatch`).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Solo lectura: la CI no escribe nada en el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Análisis (detekt + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Instalar Android SDK 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: detekt (app + desktop + core)
        # `detektMain` usa type resolution: sin ella no corren las reglas de
        # código muerto (`Unused*`), que son las que más valor aportan aquí.
        run: ./gradlew :app:detektMain :desktop:detektMain :core:detektMainJvm --stacktrace

      - name: Android Lint
        run: ./gradlew :app:lint --stacktrace

      - name: Subir informes de análisis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/detekt/debug.md
            desktop/build/reports/detekt/main.md
            core/build/reports/detekt/mainJvm.md
            app/build/reports/lint-results*.xml

  tests:
    name: Tests (Android + core + desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Los tests de UI de Compose Desktop no arrancan una ventana: se ejecutan
      # en modo sin pantalla, igual que en local (`DISPLAY= ./run.sh test desktop`).
      DISPLAY: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Instalar Android SDK 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Tests unitarios Android (app)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Tests de core (KMP jvmTest)
        run: ./gradlew :core:jvmTest --stacktrace

      - name: Tests de core (host Android)
        run: ./gradlew :core:testAndroidHostTest --stacktrace

      - name: Tests de escritorio
        run: ./gradlew :desktop:test --stacktrace

      - name: Subir resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/testDebugUnitTest
            core/build/reports/tests/jvmTest
            core/build/reports/tests/testAndroidHostTest
            desktop/build/reports/tests/test

  build:
    name: Compilar (APK + escritorio)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Instalar Android SDK 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: APK de depuración (Android)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: App-image de escritorio (Linux)
        # Comprueba que jpackage + jlink + la configuración de Compose siguen
        # funcionando antes de una release (es el paso que más se rompe).
        run: ./gradlew :desktop:createDistributable --stacktrace
